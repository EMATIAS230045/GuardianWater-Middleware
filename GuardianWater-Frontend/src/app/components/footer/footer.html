<button class="rounded-lg border-2 mt-12 shadow-2xl" [ngClass]="admin ? 'bg-violet-800 hover:bg-violet-700 border-indigo-800' : 'bg-blue-800 hover:bg-blue-700 border-gray-900'" (click)="go_cerrar()">
    <div class="rounded-lg w-full pt-1" [ngClass]="admin ? 'bg-violet-400 hover:bg-violet-300' : 'bg-blue-400 hover:bg-blue-300'">
        <div class="px-12 py-1 rounded-lg w-full mb-1 text-white hover:cursor-pointer text-shadow-[1px_1px_1px_black]" [ngClass]="admin ? 'bg-violet-500 hover:bg-violet-400' : 'bg-blue-500 hover:bg-blue-400'">Cerrar sesión</div>
    </div>
</button>
