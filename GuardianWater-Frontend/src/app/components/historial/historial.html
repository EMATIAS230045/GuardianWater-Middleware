<div class="my-8 pt-1 rounded-2xl shadow-2xl flex items-center flex-wrap justify-center" [ngClass]="admin ? 'bg-violet-600' : 'bg-sky-500'">
	<div class="w-full pb-1 rounded-2xl" [ngClass]="admin ? 'bg-indigo-600' : 'bg-blue-700'">
		<div class="max-w-[1000px] p-4 rounded-2xl bg-linear-to-b border-b-2 items-center space-y-4" [ngClass]="admin ? 'from-violet-700 to-indigo-500 border-indigo-400' : 'from-sky-600 to-blue-500 border-sky-500'">
            <div
                *ngFor="let item of items; let i = index"
                (mouseenter)="hovered = i"
                (mouseleave)="hovered = null"
                (click)="toggleItem(i)"
                class="justify-between items-center p-4 rounded-xl cursor-pointer text-white shadow-lg transition-all duration-400 ease-out [box-shadow:inset_0_0_30px_rgba(0,0,0,0.6)] border-2 border-sky-700 space-x-10 hover:scale-[1.01] max-h-20"
                [class.opacity-80]="expanded !== null && expanded !== i"
                [class.max-h-90]="expanded === i"
                [class.px-8]="expanded === i"
                [class.pt-8]="expanded === i"
                [class.overflow-hidden]="true"
                [class.flex]="expanded !== i"
                [ngClass]="admin ? 'bg-indigo-900' : 'bg-blue-900'"
            >
                <div class="flex flex-col w-full">
                    <div class="text-[16px] truncate text-shadow-[2px_2px_2px_black]" [class.truncate]="expanded !== i" [class.w-sm]="expanded !== i">{{ item.title }}</div>
                    <div class="text-[12px] text-justify bg-linear-to-b text-blue-200 rounded-xl"
                    [class.text-[13px]]="expanded === i"
                    [class.text-blue-950]="expanded === i"
                    [class.my-4]="expanded === i"
                    [class.from-sky-200]="expanded === i"
                    [class.via-slate-300]="expanded === i"
                    [class.to-slate-400]="expanded === i"
                    [class.truncate]="expanded !== i"
                    [class.w-sm]="expanded !== i"
                    [class.text-shadow-[2px_2px_2px_black]]="expanded !== i"
                    >
                        <div class="rounded-xl max-h-40 overflow-y-auto"
                        [class.bg-sky-100]="expanded === i"
                        [class.m-1]="expanded === i"
                        [class.p-4]="expanded === i"
                        [class.truncate]="expanded !== i">
                            {{ item.description }}
                        </div>
                    </div>
                </div>
                <div class="flex justify-between space-x-4">
                    <div class="flex justify-between space-x-4"> <!-- division de fechas -->
                        <div class="relative top-4 text-sm rounded-xl overflow-hidden">
                            <div class="border-2 [box-shadow:inset_0_0_10px_rgba(0,0,0,0.2)] rounded-xl text-center mt-4 pb-1 pt-4 text-shadow-[2px_2px_2px_black]" [ngClass]="admin ? 'bg-indigo-900 border-indigo-700' : 'bg-blue-900 border-sky-900'">{{ item.dateReported }}</div>
                            <div class="relative bottom-15 right-4 bg-linear-to-r from-sky-500 via-blue-500 to-blue-600 py-1 pl-10 pr-4 shadow-xl text-blue-900 border-b-3 border-blue-800">Reportado</div>
                        </div>
                        <div class="relative top-4 text-sm rounded-xl overflow-hidden">
                            <div class="border-2 [box-shadow:inset_0_0_10px_rgba(0,0,0,0.2)] rounded-xl text-center mt-4 pb-1 pt-4 text-shadow-[2px_2px_2px_black]" [ngClass]="admin ? 'bg-indigo-900 border-indigo-700' : 'bg-blue-900 border-sky-900'">{{ item.dateUpdate || 'Sin registro' }}</div>
                            <div class="relative bottom-15 right-4 bg-linear-to-r from-sky-500 via-blue-500 to-blue-600 py-1 pl-10 pr-4 shadow-xl text-blue-900 border-b-3 border-blue-800">Actualización</div>
                        </div>
                    </div>
                    <div class=""> <!-- division de estado -->
                        <div class="relative top-4 text-sm rounded-xl overflow-hidden">
                            <div class="border-2 [box-shadow:inset_0_0_10px_rgba(0,0,0,0.2)] rounded-xl text-center mt-4 pb-1 pt-4 text-shadow-[2px_2px_2px_black]" [ngClass]="admin ? 'bg-indigo-900 border-indigo-700' : 'bg-blue-900 border-sky-900'">{{ item.status }}</div>
                            <div class="relative bottom-15 right-4 bg-linear-to-r from-yellow-300 via-amber-300 to-amber-400 py-1 pl-12 pr-6 shadow-xl text-amber-800 border-b-3 border-amber-600">Estado</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
