<div class="my-8 pt-1 rounded-2xl shadow-2xl flex items-center flex-wrap justify-center" [ngClass]="admin ? 'bg-violet-600' : 'bg-sky-500'">
	<div class="w-full pb-1 rounded-2xl" [ngClass]="admin ? 'bg-indigo-700' : 'bg-blue-700'">
		<div class="px-4 py-1 rounded-2xl bg-linear-to-b border-b-2" [ngClass]="admin ? 'from-violet-600 to-indigo-500 border-indigo-400' : 'from-sky-600 to-blue-500 border-sky-500'">
            <div class="flex items-center">
                <div *ngIf="!admin" class="w-20 h-20 bg-[url('./assets/icons/guardianwater.png')] bg-cover bg-center drop-shadow-[0_6px_4px_rgba(0,0,0,0.5)] mr-4"></div>
                <div *ngIf="admin" class="w-26 h-26 bg-[url('./assets/icons/corona_admin.png')] bg-cover bg-center drop-shadow-[0_6px_4px_rgba(0,0,0,0.5)] mr-4"></div>
                <div class="flex items-center text-white text-lg h-12 mr-12 cursor-default text-shadow-[2px_2px_2px_black]">Guardian Water</div>
                <div class="w-md"></div>
            </div>
            <div class="py-3 px-2">
                <p class="text-white text-xl text-shadow-[2px_2px_2px_black]">Crear un reporte</p>
                <p class="text-sm text-shadow-[2px_2px_2px_black]" [ngClass]="admin ? 'text-indigo-200' : 'text-blue-200'">Al crear un reporte...</p>
            </div>
            <div class="rounded-xl m-2 text-white border-b-3 [box-shadow:inset_0_0_40px_rgba(0,0,0,0.6)]" [ngClass]="admin ? 'bg-indigo-900 border-indigo-400' : 'bg-blue-900 border-sky-500'">
                <div class="w-full border-t-3 p-4 rounded-xl" [ngClass]="admin ? 'border-violet-800' : 'border-blue-800'">
                    <div class="w-full flex flex-col space-y-2 p-6">
                        <p class="text-sm" [ngClass]="admin ? 'text-indigo-200' : 'text-blue-200'">Llena el formulario con los datos solicitados</p>
                        <input id="reporte_asunto" type="text" placeholder="Titulo del reporte" class="border-0 px-4 py-2 mb-4 text-gray-400 text-sm rounded-lg bg-[rgba(0,0,0,0.4)] [box-shadow:inset_0_0_15px_rgba(0,0,0,0.4)]">
                        <textarea id="reporte_descripcion" name="descripcion" type="text" placeholder="Descripción del reporte" class="border-0 px-4 py-2 h-30 mb-6 text-gray-400 text-sm rounded-lg bg-[rgba(0,0,0,0.4)] [box-shadow:inset_0_0_15px_rgba(0,0,0,0.4)]"></textarea>
                        <p class="text-sm" [ngClass]="admin ? 'text-indigo-200' : 'text-blue-200'">Incluya evidencia fotografica para validar la veracidad de su reporte</p>
                        <button class="max-w-65 mb-6 rounded-lg border-2 shadow-2xl" [ngClass]="admin ? 'bg-violet-800 hover:bg-violet-700 border-indigo-800' : 'bg-blue-800 hover:bg-blue-700 border-gray-900'">
                            <div class="rounded-lg w-64 pt-1" [ngClass]="admin ? 'bg-violet-400 hover:bg-violet-300' : 'bg-blue-400 hover:bg-blue-300'">
                                <div class="px-4 py-1 rounded-lg w-full mb-1 text-white hover:cursor-pointer text-sm text-shadow-[1px_1px_1px_black]" [ngClass]="admin ? 'bg-violet-500 hover:bg-violet-400' : 'bg-blue-500 hover:bg-blue-400'">Agregar evidencia</div>
                            </div>
                        </button>
                        <p class="text-sm" [ngClass]="admin ? 'text-indigo-200' : 'text-blue-200'">Selecciona la ubicación</p>
                        <!-- mapa de ubibcación -->
                        <div class="rounded-lg text-gray-400 h-64 p-4 bg-[rgba(0,0,0,0.4)] [box-shadow:inset_0_0_15px_rgba(0,0,0,0.4)]">mapa</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="flex justify-between">
    <button class="rounded-lg border-2 shadow-2xl" [ngClass]="admin ? 'bg-violet-800 hover:bg-violet-700 border-indigo-800' : 'bg-blue-800 hover:bg-blue-700 border-gray-900'" (click)="goback()">
        <div class="rounded-lg w-64 pt-1" [ngClass]="admin ? 'bg-violet-400 hover:bg-violet-300' : 'bg-blue-400 hover:bg-blue-300'">
            <div class="px-4 py-1 rounded-lg w-full mb-1 text-white hover:cursor-pointer text-shadow-[1px_1px_1px_black]" [ngClass]="admin ? 'bg-violet-500 hover:bg-violet-400' : 'bg-blue-500 hover:bg-blue-400'">Descartar y volver</div>
        </div>
    </button>
    <button class="bg-yellow-800 hover:bg-yellow-700 rounded-lg border-2 shadow-2xl" (click)="create_report()">
        <div class="bg-yellow-400 hover:bg-yellow-300 rounded-lg w-64 pt-1">
            <div class="bg-yellow-500 px-12 py-1 rounded-lg w-full mb-1 text-white hover:bg-yellow-400 hover:cursor-pointer text-shadow-[1px_1px_1px_black]">Enviar reporte</div>
        </div>
    </button>
</div>
