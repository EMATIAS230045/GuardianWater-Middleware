<div class="my-8 pt-1 rounded-2xl shadow-2xl flex items-center flex-wrap justify-center" [ngClass]="admin ? 'bg-violet-600' : 'bg-sky-500'">
	<div class="w-full pb-1 rounded-2xl" [ngClass]="admin ? 'bg-indigo-700' : 'bg-blue-700'">
		<div class="px-4 py-1 rounded-2xl bg-linear-to-b border-b-2" [ngClass]="admin ? 'from-violet-600 to-indigo-500 border-indigo-400' : 'from-sky-600 to-blue-500 border-sky-500'">
            <div class="flex items-center">
                <div *ngIf="!admin" class="w-20 h-20 bg-[url('./assets/icons/guardianwater.png')] bg-cover bg-center drop-shadow-[0_6px_4px_rgba(0,0,0,0.5)] mr-4"></div>
                <div *ngIf="admin" class="w-26 h-26 bg-[url('./assets/icons/corona_admin.png')] bg-cover bg-center drop-shadow-[0_6px_4px_rgba(0,0,0,0.5)] mr-4"></div>
                <div class="flex items-center text-white text-lg h-12 mr-12 cursor-default text-shadow-[2px_2px_2px_black]">Guardian Water</div>   
                <div class="w-md"></div>
            </div>
            <div class="text-center py-4">
                <p class="text-white text-xl text-shadow-[2px_2px_2px_black]">Perfil</p>
            </div>
            <div class="rounded-xl m-2 text-white border-b-3 [box-shadow:inset_0_0_40px_rgba(0,0,0,0.6)]" [ngClass]="admin ? 'border-indigo-400 bg-indigo-900' : 'border-sky-500 bg-blue-900'">
                <div class="w-full border-t-4 p-4 rounded-xl" [ngClass]="admin ? 'border-violet-800' : 'border-sky-800'">
                    <div class="w-full flex">
                        <div class="flex flex-col">
                            <div class="flex justify-center items-center bg-gray-800 w-48 h-48 rounded-2xl mx-6 mt-6 mb-2 shadow-2xl [box-shadow:inset_0_0_40px_rgba(0,0,0,0.4)]">
                                <div class="w-32 h-32 bg-[url('./assets/icons/icon_perfil.png')] bg-cover bg-center drop-shadow-[0_6px_4px_rgba(0,0,0,0.5)]"></div>
                            </div>
                            <p class="ml-6 text-sm text-gray-300 hover:cursor-pointer hover:text-sky-100" (click)="load_photo()">Actualizar foto de perfil*</p>
                        </div>
                        <div class="m-6">
                            <div class="mb-4">
                                <h1 id="name" class="text-xl" [ngClass]="admin ? 'text-indigo-200' : 'text-blue-200'">{{ user.name }} {{ user.last_name }}</h1>
                            </div>
                            <div class="mb-4">
                                <h1 id="name" class="text-md" [ngClass]="admin ? 'text-indigo-200' : 'text-blue-200'">{{ user.email }}</h1>
                            </div>
                            <div class="mb-4">
                                <h1 id="name" class="text-md" [ngClass]="admin ? 'text-indigo-200' : 'text-blue-200'">{{ user.direction }}</h1>
                            </div>
                            <div class="mb-4">
                                <div class="rounded-lg mb-2 py-1 px-4 min-x-2xl text-gray-400 text-md bg-[rgba(0,0,0,0.4)] [box-shadow:inset_0_0_15px_rgba(0,0,0,0.4)]">{{ user.password }}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="flex justify-between">
    <button class="rounded-lg border-2 shadow-2xl" [ngClass]="admin ? 'bg-violet-800 hover:bg-violet-700 border-indigo-800' : 'bg-blue-800 hover:bg-blue-700 border-gray-900'" (click)="goback()">
        <div class="rounded-lg w-64 pt-1" [ngClass]="admin ? 'bg-violet-400 hover:bg-violet-300' : 'bg-blue-400 hover:bg-blue-300'">
            <div class="px-4 py-1 rounded-lg w-full mb-1 text-white hover:cursor-pointer text-shadow-[1px_1px_1px_black]" [ngClass]="admin ? 'bg-violet-500 hover:bg-violet-400' : 'bg-blue-500 hover:bg-blue-400'">Descartar y volver</div>
        </div>
    </button>

    <button class="bg-yellow-800 hover:bg-yellow-700 rounded-lg border-2 shadow-2xl" (click)="save_profile()">
        <div class="bg-yellow-400 hover:bg-yellow-300 rounded-lg w-64 pt-1">
            <div class="bg-yellow-500 px-4 py-1 rounded-lg w-full mb-1 text-white hover:bg-yellow-400 hover:cursor-pointer text-shadow-[1px_1px_1px_black]">Guardar cambios</div>
        </div>
    </button>
</div>
