<div class="relative min-h-screen w-full overflow-hidden font-clash">
	<!-- Segundo fondo (login) -->
	<div class="absolute inset-0 -z-10 bg-[#0F3276] bg-center bg-no-repeat bg-contain transition-opacity duration-500 bg-[url('./assets/images/background_login.png')]" [class.opacity-0]="start"></div>

	<div class="relative flex justify-center min-h-screen">
		<app-login-container [class.hidden]="start" (loginSuccess)="alternarFondo()"></app-login-container>
		<app-main-container [class.hidden]="!start" (cerrarSesionA)="alternarFondo()"></app-main-container>
	</div>
</div>
